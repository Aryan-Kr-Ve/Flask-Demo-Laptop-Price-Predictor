<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Laptop Price Predictor{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="blueprint-grid" aria-hidden="true"></div>

<header class="site-nav">
  <a href="{{ url_for('index') }}" class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="4" y="6" width="24" height="15" rx="1" stroke="currentColor" stroke-width="1.6"/>
      <path d="M2 25h28l-2.5-4h-23L2 25Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M13 21v2M19 21v2" stroke="currentColor" stroke-width="1.6"/>
    </svg>
    <span>LAPTOP<em>/PRICE</em></span>
  </a>

  <nav class="nav-links" aria-label="Primary">
    <a href="{{ url_for('index') }}" class="{{ 'is-active' if active == 'home' else '' }}">
      <span class="nav-tag">01</span>Home
    </a>
    <a href="{{ url_for('predict_page') }}" class="{{ 'is-active' if active == 'predict' else '' }}">
      <span class="nav-tag">02</span>Predict
    </a>
    <a href="{{ url_for('about') }}" class="{{ 'is-active' if active == 'about' else '' }}">
      <span class="nav-tag">03</span>About
    </a>
  </nav>

  <a class="repo-link" href="https://github.com/Aryan-Kr-Ve/-Laptop-Price-Predictor-Machine-Learning-Project" target="_blank" rel="noopener">
    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    Source
  </a>

  <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-line"></div>
  <p>Voting-Regressor pipeline trained on 1,300+ retail laptop listings &middot; ~89% R&sup2; &middot; built by Aryan Kumar Verma</p>
  <p class="footer-sub">Estimates only — real-world pricing varies by retailer, region and stock.</p>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
